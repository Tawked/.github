name: Feature request
description: Something you need an SDK to do.
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@tawked/sdk"
        - "@tawked/better-auth"
        - tawked/tawked-php
        - tawked/laravel
        - tawked (Python)
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What you are trying to do
      description: The task, in your own words, and who it is for.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: Your workaround, or why there is none.
